name: Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main  # Change to "master" if your default branch uses that name

jobs:
  web-deploy:
    name: 🎉 Deploying Site
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files to InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftpupload.net
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /htdocs/  # Uploads directly into InfinityFree's public web folder
